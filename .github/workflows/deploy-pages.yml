# Build OrthoLab and publish dist/ to GitHub Pages.
# Runs on pushes to main, or manually from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # guard against publishing source: the built page must load bundled JS, never src/main.tsx
      - name: Verify build output
        run: |
          test -f dist/index.html
          # match only a real script tag; the boot-failure help text mentions the filename on purpose
          if grep -Eq '<script[^>]*src="[^"]*main\.tsx"' dist/index.html; then echo "dist/index.html still loads src/main.tsx"; exit 1; fi
          grep -q 'assets/index-.*\.js' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
